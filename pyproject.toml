[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liain"
dynamic = ["version"]              # 단일 소스: liain/__init__.py __version__ 에서 읽음
description = "Liain — a config-driven body for AI personas. Bring your own soul."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lain" }]
keywords = ["ai", "persona", "agent", "memory", "messaging", "claude", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# 로컬 임베딩/검색을 쓸 때
local = ["sentence-transformers>=2.2"]

[project.urls]
Homepage = "https://lian-lain.com/liain"
Repository = "https://github.com/Elcarsen5/LIAIN"
Documentation = "https://github.com/Elcarsen5/LIAIN/blob/main/docs/INSTALL.md"

[project.scripts]
liain = "liain.cli:main"

[tool.setuptools.dynamic]
version = { attr = "liain.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["liain*"]
